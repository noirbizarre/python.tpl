# uv with all features and manual release, opposite to uv-minimal's release flow.
snapshot = true
git = true

[answers]
distribution = "uv-full-example"
package = "uv_full_example"
description = "uv stack, manual release, every slot on"
owner = "noirbizarre"
author_name = "Axel H."
author_email = "noirbizarre@gmail.com"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "python, example"
stack = "uv"
python_min = "3.11"
cli = true
cli_name = "uv-full"
docs = true
docs_accent = "teal"
pypi = true
codecov = true
gh_ship = false

[expect]
absent = [".github/workflows/prepare-release.yaml", "pdm.toml"]

[expect.contains]
# This is the case that exercises uv build/relock in a manual release.
".github/workflows/release.yaml" = ["uv build", "uv lock", "gh-action-pypi-publish"]
# The CLI name deliberately differs from the distribution name.
"pyproject.toml" = ['uv-full = "uv_full_example.cli:app"']
".github/workflows/docs.yaml" = ["uv sync --group docs", "mise run docs:build"]

[expect.lacks]
"pyproject.toml" = ["[tool.pdm.scripts]"]

[commands]
after = [
  "prek validate-config prek.toml",
  "mise trust ./mise.toml",
  "mise run install",
  "mise run ci",
  "git add --all",
  "mise run hooks",
]
