# PDM with uv resolution: the backend and task host remain PDM's.
snapshot = true
git = true

[answers]
distribution = "pdm-uv-example"
package = "pdm_uv_example"
description = "PDM with the uv resolver, every slot on"
owner = "noirbizarre"
author_name = "Axel H."
author_email = "noirbizarre@gmail.com"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "python, example"
stack = "pdm-uv"
python_min = "3.11"
cli = true
cli_name = "pdm-uv-example"
docs = true
docs_accent = "indigo"
pypi = true
codecov = true
gh_ship = true
gh_ship_token_mode = "token"

[expect.contains]
".github/workflows/ship.yaml" = ["  ship:", "gh ship run", "secrets.SHIP_TOKEN || github.token", "actions: write", "pull-requests: write", "issues: write", "SHIP_RUN_TIMEOUT: 7200", "timeout-minutes: 150", "persist-credentials: false", "if: github.repository_owner == 'noirbizarre'"]
".github/workflows/prepare-release.yaml" = ["secrets.SHIP_TOKEN || github.token", "contents: write", "41898282+github-actions[bot]@users.noreply.github.com"]
".github/workflows/publish-release.yaml" = ["secrets.SHIP_TOKEN || github.token", "contents: write"]
"CONTRIBUTING.md" = ["No GitHub App is required", "default\ntoken does not trigger those runs"]
"pdm.toml" = ["use_uv = true"]
"pyproject.toml" = ['build-backend = "pdm.backend"', "[tool.pdm.scripts]", 'version_provider = "scm"']
".github/workflows/ci.yaml" = ["pdm config python.install_root"]
".github/workflows/docs.yaml" = ["  pull_request:", "pdm install -G docs", "pdm run docs:build", "        if: github.event_name != 'pull_request'", "    if: github.event_name != 'pull_request'", "format('pages-pr-{0}', github.event.number)", "    permissions:\n      pages: write\n      id-token: write"]

[expect.lacks]
".github/workflows/ship.yaml" = ["gh ship prepare", "gh ship release", "  prepare:", "  release:", "actions/create-github-app-token", "APP_CLIENT_ID", "APP_PRIVATE_KEY", "steps.app-token"]
".github/workflows/prepare-release.yaml" = ["actions/create-github-app-token", "APP_CLIENT_ID", "APP_PRIVATE_KEY", "steps.app-token", "steps.bot", "APP_SLUG", "BOT_ID"]
".github/workflows/publish-release.yaml" = ["actions/create-github-app-token", "APP_CLIENT_ID", "APP_PRIVATE_KEY", "steps.app-token"]
"mise.toml" = ["[tasks"]

[commands]
env = { PDM_IGNORE_ACTIVE_VENV = "1" }
after = [
  "prek validate-config prek.toml",
  "python -c \"import pathlib, subprocess, tomllib; subprocess.run(tomllib.loads(pathlib.Path('mise.toml').read_text())['hooks']['postinstall'][0], shell=True, check=True)\"",
  "test -x .git/hooks/pre-commit",
  "test -x .git/hooks/commit-msg",
  "pdm install -G:all",
  "pdm run ci",
  "git add --all",
  "prek run --all-files --show-diff-on-failure",
]
