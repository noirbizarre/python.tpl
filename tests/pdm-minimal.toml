# Plain PDM, every optional slot off. Snapshots cover the complete file set.
snapshot = true
git = true

[answers]
distribution = "minimal-example"
package = "minimal_example"
description = "Every optional slot turned off"
owner = "noirbizarre"
author_name = "Axel H."
author_email = "noirbizarre@gmail.com"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "python"
stack = "pdm"
python_min = "3.11"
cli = false
docs = false
pypi = false
codecov = false
gh_ship = false

[expect]
# Conditional release shapes must never coexist.
absent = [".github/workflows/prepare-release.yaml", ".github/workflows/docs.yaml", "pdm.toml", "zensical.toml"]

[expect.contains]
"pyproject.toml" = ['build-backend = "pdm.backend"', 'dynamic = ["version"]', "[tool.pdm.scripts]"]

[expect.lacks]
"mise.toml" = ["[tasks"]

[commands]
env = { PDM_IGNORE_ACTIVE_VENV = "1" }
after = [
  "prek validate-config prek.toml",
  "python -c \"import pathlib, subprocess, tomllib; subprocess.run(tomllib.loads(pathlib.Path('mise.toml').read_text())['hooks']['postinstall'][0], shell=True, check=True)\"",
  "test -x .git/hooks/pre-commit",
  "test -x .git/hooks/commit-msg",
  "pdm install -G:all",
  "pdm run ci",
  "git add --all",
  "prek run --all-files --show-diff-on-failure",
]
