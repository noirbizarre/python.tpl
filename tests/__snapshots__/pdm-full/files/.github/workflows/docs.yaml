name: 📚 Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain is pinned by mise.lock, so this build uses the same
      # versions as the same task run locally.
      - uses: jdx/mise-action@v5
        with:
          reshim: true
          cache: true

      - name: Install
        run: pdm install -G docs

      - name: Build the site
        run: pdm run docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
