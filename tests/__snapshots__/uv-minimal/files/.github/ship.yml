# yaml-language-server: $schema=https://noirbizarre.github.io/gh-ship/schema/config/v1.json
#
# gh-ship orchestrates the release; it computes no version and writes no
# changelog, by design. Those come from commitizen and the `emotional` rule
# set, run by the `prepare-release` workflow — the same pair that validates
# every commit message via the prek `commit-msg` hook.
#
# If this file or the workflows it names stop satisfying gh-ship's contract,
# `gh ship validate` fails in ♻️ CI — on a pull request, rather than halfway
# through a release.

version: 1

# Where the release is staged. gh-ship moves this branch onto the staged commit
# on every prepare, so anything pushed to it by hand is discarded.
release_branch: release/next

workflows:
  prepare: prepare-release
  publish: publish-release

pull_request:
  # GitHub composes the squash commit from this title, and this repository's
  # `commit-msg` hook is `cz check` — so the title has to be a Conventional
  # Commit subject. `Release {{ version }}` would be rejected by the project's own
  # hook.
  #
  # `chore` is also a non-bumping type in the `emotional` rule set, and that is
  # load-bearing: the *next* `cz bump --get-next` does not count this commit as
  # an unreleased change, so a repository whose only new commit is its own
  # release commit correctly reports "nothing to release" instead of proposing
  # a version out of nothing, forever.
  #
  # Requires, in the repository settings:
  #   squash_merge_commit_title:   PR_TITLE
  #   squash_merge_commit_message: BLANK
  title: "chore(release): {{ version }}"
  header: |
    This pull request prepares the next release of uv-minimal-example.

    The version and the changelog below were produced by the `prepare-release`
    workflow, using commitizen and the `emotional` rule set. Review the
    changelog, then merge — 🚢 Ship takes it from there: it tags the merge
    commit, drafts the release, publishes the artifacts and makes it public.
  footer: |
    ---
    Generated by [gh-ship](https://github.com/noirbizarre/gh-ship).
  labels: [release]
  reuse: true

release:
  # Created as a draft and made public only once the publish workflow has
  # attached everything, so a release is never visible without its artifacts.
  draft: true
