[files]
extend-exclude = [
  # Short SHAs in the changelog and the lockfiles read as typos.
  "CHANGELOG.md",
  "mise.lock",
  "pdm.lock",
  "uv.lock",
  # Snapshots and fixtures record output verbatim, including any deliberate
  # typo under test.
  "tests/fixtures/**",
  "tests/snapshots/**",
  # Documentation build output.
  "site/**",
]

[default.extend-words]
# Deliberate misspellings that a test asserts on — typically the input to a
# "did you mean ...?" diagnostic. Correcting one here deletes the test that
# proves the suggestion works.
