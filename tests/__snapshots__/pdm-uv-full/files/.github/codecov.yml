# Coverage is uploaded once per interpreter in the ♻️ CI matrix, each leg
# flagged with its version.
#
# There is deliberately no `after_n_builds`. rust.tpl sets it, because its
# matrix is a fixed three operating systems; here the matrix length moves with
# `python_min`, so a number written down once would silently stop matching the
# first time a project raised its floor — and a wrong `after_n_builds` is worse
# than none, because Codecov then waits for a report that will never arrive.
# `comment.require_changes` below covers the noise that setting was there for.

# Every leg runs on every commit, so a missing report means a broken run, not
# an untested interpreter — nothing should be carried forward to hide it.
flag_management:
  default_rules:
    carryforward: false

coverage:
  range: "80...100"
  status:
    project:
      default:
        target: auto
        # A drop of half a percent is noise; anything more is a decision.
        threshold: 0.5%
    patch:
      default:
        # New code is held to a fixed bar, with no threshold: "this pull
        # request is 80% covered" does not become negotiable because the
        # project average is high.
        target: 80%
        threshold: 0%

comment:
  require_changes: true
