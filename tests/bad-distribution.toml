# Distribution names follow the PyPA name format, independently of the import
# package and command names. Spaces are invalid even though dots, underscores,
# uppercase letters and repeated separators are allowed.
#
# Asserted by diagnostic code, never by message. Pinning prose is how error
# messages stop improving.

[answers]
distribution = "Not A Valid Name"

[expect]
error = "tpl::eval::pattern_mismatch"
