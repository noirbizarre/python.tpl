# uv with only gh-ship enabled: cross the release fork with the stack fork.
snapshot = true
git = true

[answers]
distribution = "uv-minimal-example"
package = "uv_minimal_example"
description = "uv stack, gh-ship, nothing else"
owner = "noirbizarre"
author_name = "Axel H."
author_email = "noirbizarre@gmail.com"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "python"
stack = "uv"
python_min = "3.12"
cli = false
docs = false
pypi = false
codecov = false
gh_ship = true

[expect]
absent = [".github/workflows/release.yaml", ".github/workflows/docs.yaml", "pdm.toml", "zensical.toml"]

[expect.contains]
"pyproject.toml" = ['build-backend = "uv_build"', 'version = "0.1.0"', 'version_provider = "pep621"']
"mise.toml" = ["uv run --group test pytest"]
# A static-version release must refresh the lockfile after bumping.
".github/workflows/prepare-release.yaml" = ["uv lock", "--files-only"]

[expect.lacks]
"pyproject.toml" = ["[tool.pdm.scripts]", 'dynamic = ["version"]']
".github/workflows/publish-release.yaml" = ["gh-action-pypi-publish"]

[commands]
after = [
  "prek validate-config prek.toml",
  "python -c \"import pathlib, subprocess, tomllib; subprocess.run(tomllib.loads(pathlib.Path('mise.toml').read_text())['hooks']['postinstall'][0], shell=True, check=True)\"",
  "test -x .git/hooks/pre-commit",
  "test -x .git/hooks/commit-msg",
  "mise trust ./mise.toml",
  "mise run install",
  "mise run ci",
  # Reproduce generated release notes rejected by rumdl and rewritten by EOF fixing.
  "python -c \"from pathlib import Path; Path('CHANGELOG.md').write_bytes(b'## 0.2.0\\n\\nhttps://github.com/noirbizarre/python.tpl\\n\\n')\"",
  "git add --all",
  "mise run hooks",
  "python -c \"from pathlib import Path; assert Path('CHANGELOG.md').read_bytes() == b'## 0.2.0\\n\\nhttps://github.com/noirbizarre/python.tpl\\n\\n'\"",
  # Ordinary Markdown must still be checked, including the same heading rule.
  "python -c \"from pathlib import Path; import subprocess; p = Path('hook-probe.md'); p.write_text('## Invalid first heading\\n'); result = subprocess.run(['prek', 'run', 'rumdl-check', '--files', str(p)], capture_output=True, text=True); p.unlink(); assert result.returncode == 1 and 'MD041' in result.stdout + result.stderr, result\"",
]
