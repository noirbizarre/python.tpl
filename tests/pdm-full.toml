# Every optional slot on, PDM stack, gh-ship release flow.
#
# The mirror of pdm-minimal: what that case asserts is absent, this asserts is
# present, so a slot that stopped rendering altogether fails here rather than
# passing both cases quietly.
#
# `python_min = "3.11"` rather than the default, so the case also proves that
# the range is derived: one answer moves `requires-python`, the classifiers,
# the ruff target, the ty environment and the CI matrix together.

[answers]
distribution = "full-example"
package = "full_example"
description = "Every optional slot turned on"
owner = "noirbizarre"
author_name = "Axel H."
author_email = "noirbizarre@gmail.com"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "python, example, template"
stack = "pdm"
python_min = "3.11"
cli = true
cli_name = "full-example"
docs = true
docs_accent = "deep orange"
pypi = true
codecov = true
gh_ship = true

[expect]
files = [
  "pyproject.toml",
  "zensical.toml",
  "docs/index.md",
  "docs/api.md",
  "docs/adr/README.md",
  "docs/images/icon.svg",
  ".github/codecov.yml",
  ".github/ship.yml",
  ".github/workflows/docs.yaml",
  ".github/workflows/ship.yaml",
  ".github/workflows/prepare-release.yaml",
  ".github/workflows/publish-release.yaml",
  "src/full_example/cli.py",
  "src/full_example/__main__.py",
]
absent = [
  # The two release shapes are mutually exclusive by construction; this is what
  # proves the `{% if not gh_ship %}` segment really is the negation.
  ".github/workflows/release.yaml",
  # `pdm.toml` belongs to the pdm-uv stack alone.
  "pdm.toml",
]

[expect.contains]
"pyproject.toml" = [
  'requires-python = ">=3.11"',
  '"cyclopts',
  "[project.scripts]",
  'full-example = "full_example.cli:app"',
  '"zensical',
  '"mkdocstrings-python',
  'Documentation = "https://noirbizarre.github.io/full-example/"',
  'target-version = "py311"',
  'python-version = "3.11"',
  # 3.10 is below the floor and must not appear in the classifiers, even though
  # it is in data/python.toml.
  '"Programming Language :: Python :: 3.11"',
  '"docs:build".cmd = "zensical build"',
]
# The matrix, the classifiers and requires-python all move together.
".github/workflows/ci.yaml" = [
  '"3.11", "3.12", "3.13", "3.14"',
  "codecov-action",
  "gh ship validate",
]
# Every task is a PDM script, the docs ones included, and mise.toml stays a
# toolchain file.
".github/workflows/docs.yaml" = ["pdm install -G docs", "pdm run docs:build"]
"zensical.toml" = [
  'accent = "deep orange"',
  'site_url = "https://noirbizarre.github.io/full-example/"',
  # Every nav entry points at a file this case also asserts exists.
  '{ "API reference" = "api.md" }',
]
"docs/api.md" = ["::: full_example"]
".github/ship.yml" = ["chore(release):"]
".github/workflows/prepare-release.yaml" = [
  "pdm run cz",
  "--files-only",
  "ship.release.json",
]
".github/workflows/publish-release.yaml" = [
  "pdm build",
  "gh-action-pypi-publish",
  "id-token: write",
]
# Every conditional badge, asserted where it is rendered rather than assumed.
"README.md" = [
  "pypi/v/full-example",
  "codecov.io",
  "img.shields.io/github/v/release",
  "docs-noirbizarre.github.io",
]
