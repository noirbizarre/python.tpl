# Every slot on, PDM and gh-ship; the default Python floor aligns all targets.
snapshot = true
git = true

[answers]
distribution = "full-example"
package = "full_example"
description = "Every optional slot turned on"
owner = "noirbizarre"
author_name = "Axel H."
author_email = "noirbizarre@gmail.com"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "python, example, template"
stack = "pdm"
python_min = "3.11"
cli = true
cli_name = "full-example"
docs = true
docs_accent = "deep orange"
pypi = true
codecov = true
gh_ship = true

[expect]
absent = [".github/workflows/release.yaml", "pdm.toml"]

[expect.contains]
"pyproject.toml" = ['requires-python = ">=3.11"', 'target-version = "py311"', 'python-version = "3.11"']
".github/workflows/ci.yaml" = ['"3.11", "3.12", "3.13", "3.14", "3.15"']
".github/workflows/docs.yaml" = ["  pull_request:", "pdm install -G docs", "pdm run docs:build", "        if: github.event_name != 'pull_request'", "    if: github.event_name != 'pull_request'", "format('pages-pr-{0}', github.event.number)", "    permissions:\n      pages: write\n      id-token: write"]

[expect.lacks]
"pyproject.toml" = ['"Programming Language :: Python :: 3.10"']
"mise.toml" = ["[tasks"]

[commands]
env = { PDM_IGNORE_ACTIVE_VENV = "1" }
after = [
  "prek validate-config prek.toml",
  "python -c \"import pathlib, subprocess, tomllib; subprocess.run(tomllib.loads(pathlib.Path('mise.toml').read_text())['hooks']['postinstall'][0], shell=True, check=True)\"",
  "test -x .git/hooks/pre-commit",
  "test -x .git/hooks/commit-msg",
  "pdm install -G:all",
  "pdm run ci",
  "git add --all",
  "prek run --all-files --show-diff-on-failure",
]
