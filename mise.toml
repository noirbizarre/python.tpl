# Tooling for developing the template itself. git tpl test checks snapshots
# and runs each generated project's own checks in an isolated sandbox.

[settings]
lockfile = true

[tools]
prek = "latest"
typos = "latest"
actionlint = "latest"
# The explicit aqua backend supplies lockfile URLs for locked installs.
"aqua:koalaman/shellcheck" = "latest"
python = "3.14"
uv = "latest"
pdm = "latest"
cargo-binstall = "latest"
# Exact versions live in mise.lock; mise up advances them together.
"cargo:git-tpl" = "latest"

[tasks.default]
description = "Lint the template and test every rendered project"
depends = ["lint", "test"]

[tasks.lint]
description = "Everything that reads the template without rendering it"
depends = ["spell", "lint:actions", "lint:template"]

[tasks."lint:template"]
description = "Lint the template itself"
run = "git tpl lint . --dirty -D warnings"

[tasks."test:template"]
description = "Check render expectations and snapshots without project commands"
raw_args = true
run = "git tpl test --skip-commands"

[tasks.test]
description = "Check snapshots and run every rendered project's own checks"
raw_args = true
run = "git tpl test"

[tasks."test:write"]
description = "Record render snapshots; review the diff and run test afterward"
raw_args = true
run = "git tpl test --write"

[tasks.spell]
description = "Check spelling"
run = "typos"

[tasks."lint:actions"]
description = "Lint this repository's own workflows"
run = "actionlint .github/workflows/*.yaml"

[tasks.hooks]
description = "Run every prek hook over every file"
run = "prek run --all-files --show-diff-on-failure"

[tasks.render]
description = "Render one test case into a directory and print where"
usage = 'arg "<case>" help="The test case under tests/" default="pdm-full"'
run = """
#!/usr/bin/env bash
set -euo pipefail
case="${usage_case:-pdm-full}"
out="${OUT:-$(mktemp -d)}"
# The same answer file drives manual rendering and the test suite.
git tpl render "$MISE_PROJECT_ROOT" --dirty \\
  --output "$out" --force \\
  --answers-from "$MISE_PROJECT_ROOT/tests/$case.toml" \\
  --defaults --strict-answers
echo
echo "Rendered $case into $out"
"""

[tasks."render:check"]
description = "Test one case's snapshot and generated project"
usage = 'arg "<case>" help="The test case under tests/" default="pdm-full"'
run = 'git tpl test "${usage_case:-pdm-full}"'
