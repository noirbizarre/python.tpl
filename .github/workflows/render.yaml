name: 🖨️ Render

# Three layers, and each answers a question the others cannot.
#
#   lint    — is this a valid *template*?           `git tpl lint`
#   test    — does each case render what it should? `git tpl test`
#   render  — is the output a working *project*?    install it and run its checks
#
# The third is the expensive one and the only one that has ever caught a
# `pyproject.toml` that rendered perfectly and then failed to install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"
  # NOT `MISE_ACTION_VERSION`: mise reads `MISE_<TOOL>_VERSION` from the
  # environment, so that name would be read as a request to install a tool
  # called `action`.
  PINNED_MISE_VERSION: 2026.7.18

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🕵️ Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.PINNED_MISE_VERSION }}
          cache: true

      # Runs `git tpl lint` and `git tpl test` among the rest, because they are
      # prek hooks — so a contributor's `git commit` and this job cannot check
      # different things.
      - name: Run the hooks
        run: prek run --all-files --show-diff-on-failure

  render:
    name: 🖨️ ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      # Knowing that pdm-minimal and uv-full both fail is a different diagnosis
      # from knowing that only pdm-minimal does.
      fail-fast: false
      matrix:
        # Every case under tests/, except the one that asserts an error and
        # therefore renders nothing.
        case:
          - pdm-minimal
          - pdm-full
          - pdm-uv-full
          - uv-minimal
          - uv-full
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.PINNED_MISE_VERSION }}
          cache: true

      # Renders the case, parses every rendered TOML and YAML file, runs
      # actionlint over the rendered workflows, installs the project with its
      # own stack, and runs its own lint, type-check, test and docs tasks.
      #
      # One task rather than a dozen steps, so `mise run render:check <case>`
      # locally reproduces this job exactly.
      - name: Render and check
        run: mise run render:check ${{ matrix.case }}
